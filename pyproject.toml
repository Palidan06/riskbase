[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskbase"
version = "0.1.0"
description = "Internal terminal travel threat assessment tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[project.scripts]
riskbase = "riskbase.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["riskbase*"]
